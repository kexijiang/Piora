*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,'Microsoft YaHei UI',sans-serif}button,input,textarea,select{font:inherit;color:inherit}button,a{ -webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0;background:none;border-radius:8px;padding:8px 11px;display:inline-flex;align-items:center;justify-content:center;gap:8px}button:hover{background:var(--hover)}button:focus-visible,a:focus-visible{outline:2px solid #2f6feb;outline-offset:3px}button:disabled{opacity:.35;cursor:default}a{color:inherit}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.viewer{height:60px;padding:0 24px;display:flex;align-items:center;gap:20px;border-bottom:1px solid var(--line);background:var(--panel)}.viewer b{font-size:14px}.viewer span{color:var(--dim);font-size:12px}.viewer select{margin-left:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px}.viewer a{text-decoration:none;font-size:12px}.app{height:calc(100vh - 60px);display:grid;grid-template-columns:224px 1fr;overflow:hidden}.capture .viewer{display:none}.capture .app{height:100vh}.sidebar{background:var(--panel);padding:20px 12px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:600;display:flex;align-items:center;gap:11px;padding:0 12px 24px}.brand .logo{font:600 23px Georgia,serif;background:var(--primary);color:var(--on);width:30px;height:30px;border-radius:8px;text-align:center}.navitem{padding:11px 12px;display:flex;align-items:center;gap:10px;color:var(--muted);border-radius:8px}.navitem.selected{background:var(--selected);color:var(--text)}.navitem small{margin-left:auto}.section-label{font-size:12px;color:var(--dim);padding:30px 12px 10px}.chatitem{font-size:13px;padding:11px 12px 11px 24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatitem.active{background:var(--selected);border-radius:8px}.sidebar-bottom{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;color:var(--muted)}.avatar{width:28px;height:28px;border-radius:50%;background:var(--selected);display:grid;place-items:center;font-size:12px}.main{min-width:0;min-height:0;position:relative;display:flex;flex-direction:column}.titlebar{height:60px;padding:0 30px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);flex-shrink:0}.titlebar span{font-size:12px;color:var(--dim)}.titlebar .tools{margin-left:auto;display:flex;gap:10px;color:var(--dim)}.workspace{position:relative;flex:1;overflow:auto}.conversation{max-width:860px;margin:0 auto;padding:40px 24px 340px}.date{text-align:center;font-size:12px;color:var(--dim);margin-bottom:30px}.user{margin-left:auto;background:var(--panel);border-radius:16px;padding:15px 20px;width:max-content;max-width:90%;line-height:1.8}.assistant{margin-top:32px;line-height:1.9}.assistant-head{display:flex;align-items:center;gap:10px;font-weight:600;margin-bottom:12px}.assistant-head .mark{font:600 22px Georgia,serif}.assistant p{margin:8px 0}.thinking{font-size:12px;color:var(--dim);margin-bottom:8px}.inline-command{font:13px Consolas,monospace;background:var(--panel);padding:2px 6px;border-radius:4px}.response-tools{display:flex;gap:4px;color:var(--dim);margin-top:12px}.response-tools button{padding:5px}.composer-wrap{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(860px,calc(100% - 64px));z-index:2}.composer{background:var(--bg);border:1px solid var(--line);box-shadow:0 4px 20px #00000006;border-radius:16px;padding:16px}.composer textarea{resize:none;display:block;width:100%;border:0;outline:none;background:transparent;line-height:1.8;min-height:75px;padding:10px 2px}.composer textarea::placeholder{color:var(--dim)}.composer-top{display:flex;align-items:center;gap:10px;min-height:30px}.chip{display:inline-flex;align-items:center;gap:7px;background:var(--hover);border-radius:8px;padding:6px 9px;font-size:13px}.chip code ine);padding:5px 8px;border-radius:8px;display:flex;align-items:center;gap:6px}.attachment svg{width:14px;height:14px}.field-label{display:block;font-size:12px;color:var(--muted);margin:16px 0 8px}.field{width:100%;background:transparent;border:1px solid var(--line);border-radius:8px;padding:11px 12px;outline:none}.field.invalid{border-color:var(--danger)}.validation{color:var(--danger);font-size:12px;margin:8px 0}.followup{border-top:1px solid var(--line);margin-top:15px;padding-top:14px}.followup label{display:flex;align-items:center;gap:8px;font-size:13px}.followup textarea{background:var(--panel);border-radius:8px;padding:10px 12px;min-height:85px;margin-top:10px;font-size:13px}.receipt{margin-top:30px;background:var(--panel);border-radius:16px;padding:20px;line-height:1.6}.receipt-head{display:flex;align-items:center;gap:10px}.receipt-head strong{font-size:14px;font-weight:600}.receipt-head time{margin-left:auto;font-size:12px;color:var(--dim)}.receipt p{font-size:13px;color:var(--muted);margin:10px 0 0 28px}.receipt .state-label{font-size:11px;background:var(--bg);padding:3px 7px;border-radius:5px;color:var(--muted)}.receipt-actions{display:flex;gap:8px;margin:15px 0 0 28px}.receipt-actions button{font-size:12px;padding:7px 10px}.details{margin:16px 0 0 28px;border-top:1px solid var(--line);padding-top:12px}.detail{font-size:12px;display:flex;padding:6px 0;gap:20px}.detail span:first-child{width:90px;color:var(--dim)}.detail code{font-size:12px;overflow-wrap:anywhere}.error{font:12px/1.9 Consolas,'Microsoft YaHei UI',monospace;background:var(--bg);padding:12px;border-radius:8px;color:var(--danger);margin:14px 0 0 28px;overflow-wrap:anywhere}.notice{font-size:12px;color:var(--muted);padding:11px 14px;background:var(--panel);border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}.spinner{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.option{display:flex;align-items:center;gap:10px;margin:10px 0 0 28px;padding:12px;background:var(--bg);border-radius:8px;font-size:13px}.option small{color:var(--dim);margin-left:auto}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--on);padding:12px 20px;border-radius:8px;z-index:20;font-size:13px}.saved-draft{font-size:12px;color:var(--muted);padding:0 3px 7px}.error-title{color:var(--danger)}
@media(max-width:1000px){.app{grid-template-columns:190px 1fr}.conversation{padding-left:25px;padding-right:25px}.composer-wrap{width:calc(100% - 48px)}.titlebar{padding:0 24px}.sidebar{padding-left:8px;padding-right:8px}}@media(max-width:650px){.app{grid-template-columns:1fr}.sidebar{display:none}.titlebar{padding:0 18px}.titlebar .tools button:nth-child(-n+2){display:none}.conversation{padding:24px 18px 340px}.composer-wrap{width:calc(100% - 28px);bottom:15px}.composer{padding:12px}.footer span:last-child{display:none}.composer-top{flex-wrap:wrap}.composer-top>.subtle{margin-left:0}.toolbar .subtle{display:none}.viewer span,.viewer b{display:none}.viewer{padding:0 12px;gap:10px}.viewer select{margin-left:0;min-width:0;width:70%}.menu-head span:last-child{display:none}.receipt{padding:16px}.receipt p,.receipt-actions,.details,.error,.option{margin-left:0}.command-row{padding:10px 8px}.command-row .badge{font-size:10px}.user{max-width:95%;font-size:13px}.assistant{font-size:14px}}
</style></head><body><div class="viewer"><b>Piora / 命令交互</b><span>可点击原型 · 所有结果均为模拟</span><select id="stateSelect" aria-label="界面状态"></select><button id="themeToggle" title="切换主题">◐</button><a href="overview.html">全部状态 ↗</a></div><div id="root"></div><script>
const states=[['idle','01 · 普通输入'],['menu','02 · 命令选择'],['ready','03 · 命令待执行'],['params','04 · 参数校验'],['skill','05 · Skill 与 query'],['followup','06 · 后续提问'],['queued','07 · 等待执行'],['running','08 · 执行中'],['success','09 · 执行成功'],['failure','10 · 失败与恢复'],['question','11 · 扩展提问']];
const q=new URLSearchParams(location.search);let state=q.get('state')||'menu', expanded=q.get('details')==='1'||state==='success', flow='reload',timer;const capture=q.has('capture');if(capture)document.body.classList.add('capture');if(q.get('theme')==='dark')document.documentElement.classList.add('dark');
const paths={plus:'M12 5v14M5 12h14',search:'m21 21-5-5M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16',folder:'M3 6h6l2 2h10v12H3z',chevron:'m9 5 7 7-7 7',down:'m6 9 6 6 6-6',reload:'M20 8a8 8 0 1 0 0 8M20 3v5h-5',slash:'M15 3 9 21',spark:'m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z',edit:'m4 16 12-12 4 4L8 20H4z',check:'m5 12 4 4L19 6',x:'m6 6 12 12M6 18 18 6',clock:'M12 8v5l3 2M21 12a9 9 0 1 0-18 0 9 9 0 0 0 18 0',info:'M12 11v6M12 7h.01M21 12a9 9 0 1 0-18 0 9 9 0 0 0 18 0',arrow:'M12 19V5m-6 6 6-6 6 6',file:'M14 2H5v20h14V7zM14 2v6h5',git:'M6 3v12a4 4 0 0 0 8 0V8M3 6h6M11 5h6',copy:'M8 8h12v13H8zM4 16H2V2h13v3',more:'M5 12h.01M12 12h.01M19 12h.01',panel:'M3 4h18v16H3zM15 4v16',mic:'M9 4a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0zM5 10v2a7 7 0 0 0 14 0v-2M12 19v3',stop:'M6 6h12v12H6z',settings:'M4 7h16M4 17h16M8 4v6M16 14v6'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[n]||paths.slash}"/></svg>`;const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const skillQuery='检查这次修改的异常处理和边界情况，重点关注命令执行失败后能否恢复。\n请给出具体文件位置和修改建议。';const afterQuery='确认新加载的代码审查技能能否使用，并说明它适合什么场景。';
function chip(name,type){return `<span class="chip">${icon(type==='Skill'?'spark':'slash')}<code>${name}</code><span class="kind">${type}</span><button aria-label="移除命令" onclick="go('idle')">${icon('x')}</button></span>`}
function toolbar(label='发送',action="toast('这是交互原型，未连接 Pi')"){return `<div class="toolbar"><button aria-label="添加附件" onclick="toast('原型：添加文件或图片')">${icon('plus')}</button><button aria-label="选择命令" onclick="go('menu')">${icon('slash')}</button><button class="model" onclick="toast('原型：模型选择')">Claude Sonnet ${icon('down')}</button><span class="spacer"></span><span class="subtle">${label==='发送'?'Enter 发送':'Enter 执行'}</span><button class="primary" id="submitButton" onclick="${action}">${label}${icon(label==='发送'?'arrow':'chevron')}</button></div>`}
function input(text='',placeholder='询问任何问题，输入 / 选择命令…'){return `<textarea aria-label="消息输入" placeholder="${placeholder}" oninput="if(this.value==='/')go('menu')">${esc(text)}</textarea>`}
function composer(){let body='',above='';if(state==='menu'){above=menu();body=input('/');}else if(state==='ready'){body=`<div class="composer-top">${chip('/reload','会话命令')}<span class="subtle">直接执行</span></div><p class="help">重新加载扩展、技能和提示词，保留当前对话。</p><div class="toolbar"><button class="secondary" onclick="go('followup')">${icon('plus')}完成后再提问</button><span class="spacer"></span><span class="subtle">Enter 执行</span><button class="primary" onclick="execute('reload')">执行 /reload ${icon('chevron')}</button></div>`;}else if(state==='params'){body=`<div class="composer-top">${chip('/name','会话命令')}<span class="subtle">直接执行</span></div><label class="field-label" for="name">对话名称 <span style="color:var(--danger)">*</span></label><input id="name" class="field invalid" placeholder="例如：命令交互改版" oninput="validateName(this)"><p class="validation" id="nameError">请输入新的对话名称</p><div class="toolbar"><span class="spacer"></span><button id="renameButton" class="primary" disabled onclick="toast('模拟：对话已重命名');go('idle')">重命名 ${icon('chevron')}</button></div>`;}else if(state==='skill'){body=`<div class="composer-top">${chip('/skill:code-review','Skill')}<span class="subtle">随消息一起发送</span></div>${input(skillQuery,'描述希望这个技能完成的任务…')}<div class="attachments"><span class="attachment">${icon('git')}当前改动</span><span class="attachment">${icon('file')}rpc-manager.ts</span></div>${toolbar('发送',"execute('skill')")}`;}else if(state==='followup'){body=`<div class="composer-top">${chip('/reload','会话命令')}<span class="subtle">直接执行</span></div><p class="help">重新加载扩展、技能和提示词。</p><div class="followup"><label><input type="checkbox" checked onchange="go('ready')">完成后再提问 <span class="subtle">可选</span></label>${input(afterQuery)}</div><div class="toolbar"><span class="subtle">命令成功后，自动发送下面的问题</span><span class="spacer"></span><button class="primary" onclick="execute('followup')">执行并提问 ${icon('chevron')}</button></div>`;}else{if(state==='queued')above=`<div class="notice">${icon('clock')}当前任务仍在运行 · /reload 将在本轮结束后执行</div>`;if(state==='failure')body='<div class="saved-draft">'+icon('edit')+' 后续问题已保留，可修改后重新发送</div>';body+=input(state==='failure'?afterQuery:'')+toolbar();}if(state==='menu')body+=toolbar();return `<div class="composer-wrap">${above}<div class="composer">${body}</div><div class="footer"><span>F:\\Piora <span style="padding:0 8px">·</span> main</span><span>${state==='skill'?'Skill 与正文将作为一条消息提交':'Shift + Enter 换行'} <span style="padding:0 8px">·</span> 完全访问</span></div></div>`}
function row(name,desc,badge,ico,target,active=false){return `<button class="command-row ${active?'active':''}" onclick="${target}"><span class="command-icon">${icon(ico)}</span><span class="copy"><b>${name}</b><small>${desc}</small></span><span class="badge">${badge}</span></button>`}
function menu(){return `<div class="menu"><div class="menu-head"><span>命令与技能</span><span>输入名称搜索 · Esc 关闭</span></div><div class="group">会话操作</div>${row('/reload','重新加载扩展、技能和提示词','直接执行','reload',"go('ready')",true)}${row('/name','修改当前对话名称','需要参数','edit',"go('params')")}${row('/compact','压缩上下文并继续对话','直接执行','copy',"toast('原型：将打开压缩参数表单')")}<div class="group">技能与工作流</div>${row('/skill:code-review','检查代码质量、异常处理与边界情况','随消息发送','spark',"go('skill')")}${row('/review','选择审查范围并开始代码审查','扩展命令','git',"go('question')")}<div class="menu-foot"><span>↑ ↓ 选择</span><span>Enter 补全命令</span><span>补全后可继续输入参数或任务</span></div></div>`}
function receipt(){if(!['queued','running','success','failure','question'].includes(state))return '';let title='',ico='check',meta='',content='',actions='';let name=flow==='skill'?'/skill:code-review':flow==='review'?'/review':'/reload';if(state==='queued'){ico='clock';title='/reload 等待执行';meta='排队中';content='<p>当前任务结束后，自动重新加载扩展、技能和提示词。</p>';actions=`<button class="secondary" onclick="go('idle')">取消排队</button><button onclick="go('ready')">停止当前任务并执行</button>`;}if(state==='running'){ico='reload';title=name+' '+(flow==='skill'?'正在审查代码':flow==='review'?'正在审查当前改动':'正在重新加载');meta='1.2 秒';content=`<p>${flow==='skill'||flow==='review'?'已收到命令和任务描述，正在检查当前改动。':'正在加载扩展与技能，完成后会显示结果。'}</p>`;actions='<button onclick="go(\'failure\')">查看失败示例</button>';}if(state==='success'){title=name+' 已完成';meta='1.8 秒';content=flow==='skill'||flow==='review'?'<p>代码审查已完成。下方将展示审查结论和具体修改建议。</p>':'<p>已重载 8 个扩展、12 个技能和 4 个提示词。<br>新增技能 <span class="inline-command">code-review</span> 已可使用。</p>';actions=`<button onclick="expanded=!expanded;render()">${icon(expanded?'down':'chevron')}${expanded?'收起详情':'查看详情'}</button><button onclick="go('skill')">使用代码审查技能 ${icon('chevron')}</button>`;if(expanded)content+=`<div class="details"><div class="detail"><span>执行命令</span><code>${name}</code></div><div class="detail"><span>状态</span><span>执行完成 · 当前对话已更新</span></div><div class="detail"><span>完成时间</span><span>14:32:08 · 用时 1.8 秒</span></div>${flow==='skill'||flow==='review'?'<div class="detail"><span>审查范围</span><span>当前未提交的改动</span></div>':'<div class="detail"><span>加载结果</span><span>扩展 8　技能 12　提示词 4</span></div>'}</div>`;if(flow==='followup')content+='<p>后续问题已自动发送：'+esc(afterQuery)+'</p>';}if(state==='failure'){title='/reload 未完成';ico='info';meta='执行失败';content='<p>一个扩展加载失败。修复后可以重试，当前对话仍保留。</p><div class="error">review-tools.ts:18<br>SyntaxError: Unexpected token &quot;}&quot;</div><p>后续问题尚未发送，已保留在输入框。</p>';actions=`<button class="primary" onclick="execute('reload')">${icon('reload')}重试</button><button class="secondary" onclick="toast('原型：打开 review-tools.ts 第 18 行')">打开问题文件</button><button onclick="toast('原型：显示完整错误日志')">复制错误</button>`;}if(state==='question'){title='/review 需要你选择';ico='git';meta='等待回复';content='<p>这次要审查哪些改动？</p><label class="option"><input type="radio" name="scope" checked>当前未提交的改动<small>推荐</small></label><label class="option"><input type="radio" name="scope">当前分支相对 main 的全部改动</label>';actions=`<button class="primary" onclick="execute('review')">确认并继续 ${icon('chevron')}</button><button onclick="go('idle')">取消命令</button>`;}return `<div class="receipt"><div class="receipt-head"><span class="${state==='running'?'spinner':''} ${state==='failure'?'error-title':''}">${icon(ico)}</span><strong>${title}</strong><time>${meta}</time></div>${content}<div class="receipt-actions">${actions}</div></div>`}
function render(){document.getElementById('stateSelect').value=state;document.getElementById('root').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><span class="logo">p</span>Piora</div><div class="navitem">${icon('plus')}新建对话</div><div class="navitem">${icon('search')}搜索</div><div class="section-label">工作区</div><div class="navitem">${icon('folder')}Piora<small>⌄</small></div><div class="chatitem active">梳理命令执行流程</div><div class="chatitem">Markdown 并排预览</div><div class="chatitem">文件浏览器调整</div><div class="section-label">最近</div><div class="chatitem">代码审查与边界检查</div><div class="sidebar-bottom"><span class="avatar">L</span><span>本地工作区</span><span style="margin-left:auto">${icon('settings')}</span></div></aside><main class="main"><header class="titlebar"><b>梳理命令执行流程</b><span>⌄</span><div class="tools"><button aria-label="分支">${icon('git')}</button><button aria-label="文件">${icon('panel')}</button><button aria-label="更多">${icon('more')}</button></div></header><section class="workspace"><div class="conversation"><div class="date">今天 · 14:30</div><div class="user">我新增了一个代码审查技能，想让当前对话使用它。</div><div class="assistant"><div class="assistant-head"><span class="mark">p</span>Piora</div><div class="thinking">› 已思考 3 秒</div><p>可以先用 <span class="inline-command">/reload</span> 重新加载技能。</p><p>然后选择代码审查技能，写下要检查的内容，一起发送即可。</p><div class="response-tools"><button aria-label="复制">${icon('copy')}</button><button aria-label="更多">${icon('more')}</button></div></div>${receipt()}</div></section>${composer()}</main></div>`;}
function go(next){clearTimeout(timer);state=next;expanded=next==='success';if(!['running','success'].includes(next))flow='reload';render()}
function execute(kind){flow=kind;go('running');if(!capture)timer=setTimeout(()=>go('success'),2400)}
function validateName(el){let ok=!!el.value.trim();el.classList.toggle('invalid',!ok);document.getElementById('nameError').hidden=ok;document.getElementById('renameButton').disabled=!ok}
function toast(text){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.textContent=text;document.body.append(el);setTimeout(()=>el.remove(),2600)}
document.getElementById('stateSelect').innerHTML=states.map(([s,l])=>`<option value="${s}">${l}</option>`).join('');document.getElementById('stateSelect').onchange=e=>go(e.target.value);document.getElementById('themeToggle').onclick=()=>document.documentElement.classList.toggle('dark');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state==='menu')go('idle');if(e.key==='Enter'&&!e.shiftKey&&state==='menu'){e.preventDefault();go('ready')}else if(e.key==='Enter'&&!e.shiftKey&&state==='ready'){e.preventDefault();execute('reload')}else if(e.key==='Enter'&&!e.shiftKey&&state==='skill'){e.preventDefault();execute('skill')}});render();
</script></body></html>
