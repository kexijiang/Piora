name: CI

on:
  workflow_dispatch:
    inputs:
      run_hardware:
        description: Run explicit scenarios on the approved Harmony hardware runner
        type: boolean
        default: false
      hardware_plan:
        description: Repository-relative JSON acceptance plan
        type: string
        default: tests/harmony-device-plan.json
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --legacy-peer-deps=false
      # Production dependencies stay gated at high severity. Dev tooling is excluded:
      # advisory GHSA-vfj7-8cjw-p6xm covers every published braces version (latest 3.0.3)
      # with no fixed release, and all 8 affected high findings come from dev-only chains
      # (eslint-config-next / vinext -> fast-glob -> micromatch -> braces).
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm run build:sites

  tests:
    uses: ./.github/workflows/test-suite.yml

  quality-validation:
    # These checks use their own checkout and can run alongside the test shards.
    name: Quality validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install Linux native image patch tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native-image-tools

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm run audit:runtime

      - name: Verify Harmony schemas and documentation
        run: npm run harmony:docs:check

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Check performance budgets
        if: runner.os == 'Linux'
        run: npm run perf:check

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

      - name: Build unpacked Windows application
        if: runner.os == 'Windows'
        run: npm run pack:win

      - name: Verify packaged standalone service in isolation
        if: runner.os == 'Windows'
        run: npm run verify:package

      - name: Verify physical portable payload with packaged Electron
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/verify-portable-runtime.mjs desktop/release/win-unpacked (Get-Content package.json | ConvertFrom-Json).version

  quality:
    # Preserve branch-protection check names. This gate needs neither checkout
    # nor dependencies, and must fail even when an upstream job was skipped.
    name: Quality checks (${{ matrix.os }})
    needs: [tests, quality-validation]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Require complete tests and quality validation
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality-validation.result }}
        run: >-
          node -e "for (const name of ['TEST_RESULT', 'QUALITY_RESULT']) {
          const result = process.env[name]; console.log(name + ': ' + result);
          if (result !== 'success') process.exitCode = 1; }"

  harmony-hardware:
    name: Harmony hardware acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_hardware
    runs-on: [self-hosted, Windows, harmony-device]
    environment: harmony-hardware
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:harmony-worker
      - name: Run explicit device scenarios
        shell: pwsh
        env:
          HARMONY_SERIAL: ${{ secrets.HARMONY_DEVICE_SERIAL }}
          HARMONY_PLAN: ${{ inputs.hardware_plan }}
          PIORA_HARMONY_TEST_CONTROL: '1'
        run: node scripts/verify-harmony-device.mjs --serial "$env:HARMONY_SERIAL" --plan "$env:HARMONY_PLAN"
      - name: Publish hardware summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .verification/harmony-device-report.json) {
            Get-Content .verification/harmony-device-report.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
