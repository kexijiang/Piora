name: CI

on:
  workflow_dispatch:
    inputs:
      packaging_benchmark:
        description: Build and fully verify before/after NSIS installers without publishing
        type: boolean
        default: false
      benchmark_base:
        description: Baseline commit SHA for the packaging comparison
        type: string
        default: ''
      run_hardware:
        description: Run explicit scenarios on the approved Harmony hardware runner
        type: boolean
        default: false
      hardware_plan:
        description: Repository-relative JSON acceptance plan
        type: string
        default: tests/harmony-device-plan.json
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Changelog fragments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - run: node --test lib/changelog-fragments.test.mjs
      - run: npm run changelog:check
      - name: Require PR notes or a documented exemption
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npm run changelog:check-pr -- "$BASE_SHA" "$HEAD_SHA"

  website:
    name: Website checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --legacy-peer-deps=false
      # Production dependencies stay gated at high severity. Dev tooling is excluded:
      # advisory GHSA-vfj7-8cjw-p6xm covers every published braces version (latest 3.0.3)
      # with no fixed release, and all 8 affected high findings come from dev-only chains
      # (eslint-config-next / vinext -> fast-glob -> micromatch -> braces).
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run check
      - run: npm run build:sites

  tests:
    uses: ./.github/workflows/test-suite.yml

  quality-validation:
    # These checks use their own checkout and can run alongside the test shards.
    name: Quality validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
          package-manager-cache: false

      - name: Restore npm downloads from an earlier lockfile
        if: runner.os == 'Linux' && steps.node-setup.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-npm-cache

      - name: Install Linux native image patch tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native-image-tools

      - name: Install dependencies
        if: runner.os == 'Linux'
        run: npm ci

      - name: Install exact Windows dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/install-ci-dependencies

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm run audit:runtime

      - name: Verify Harmony schemas and documentation
        if: runner.os == 'Linux'
        run: npm run harmony:docs:check

      - name: Verify release-tree hygiene
        if: runner.os == 'Linux'
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        if: runner.os == 'Linux'
        run: npm run licenses:check

      - name: Lint
        if: runner.os == 'Linux'
        run: npm run lint

      - name: Typecheck
        if: runner.os == 'Linux'
        run: npm run typecheck

      - name: Check performance budgets
        if: runner.os == 'Linux'
        run: npm run perf:check

      - name: Verify bundled backgrounds
        if: runner.os == 'Linux'
        run: npm run verify:backgrounds

      - name: Prepare verified Electron download
        if: runner.os == 'Windows'
        run: node scripts/prepare-electron-download.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build unpacked Windows application
        if: runner.os == 'Windows'
        run: npm run pack:win
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify packaged standalone service in isolation
        if: runner.os == 'Windows'
        run: npm run verify:package

      - name: Verify physical portable payload with packaged Electron
        if: runner.os == 'Windows'
        shell: pwsh
        run: node scripts/verify-portable-runtime.mjs desktop/release/win-unpacked (Get-Content package.json | ConvertFrom-Json).version

      - name: Publish standalone trace diagnostics
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: standalone-traces-${{ github.run_id }}
          path: |
            .next/next-server.js.nft.json
            .next/server/**/*.nft.json
          retention-days: 3

  installer-benchmark:
    name: Installer benchmark (${{ matrix.variant }})
    if: github.event_name == 'workflow_dispatch' && inputs.packaging_benchmark
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    permissions:
      contents: read
    env:
      PIORA_BRAND: piora
      BRAND_PREFIX: Piora
      ELECTRON_BUILDER_COMPRESSION_LEVEL: '3'
    steps:
      - name: Validate baseline commit
        shell: pwsh
        env:
          BASELINE_SHA: ${{ inputs.benchmark_base }}
        run: |
          if ($env:BASELINE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'benchmark_base must be a full commit SHA' }
      - name: Check out comparison source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ matrix.variant == 'before' && inputs.benchmark_base || github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - name: Restore baseline npm downloads
        if: matrix.variant == 'before'
        uses: ./.github/actions/restore-npm-cache
      - name: Install baseline locked dependencies
        if: matrix.variant == 'before'
        run: npm ci
      - name: Install optimized dependencies
        if: matrix.variant == 'after'
        uses: ./.github/actions/install-ci-dependencies
      - name: Read exact package identity
        id: metadata
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
          git rev-parse HEAD
      - name: Prepare verified Electron download
        run: node scripts/prepare-electron-download.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build benchmark NSIS installer
        run: npm run dist:win:preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify benchmark update metadata
        shell: pwsh
        env:
          EXPECTED_TAG: ${{ steps.metadata.outputs.tag }}
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release $env:EXPECTED_TAG
      - name: Install and fully verify benchmark artifacts
        shell: pwsh
        run: |
          $env:GITHUB_REF_NAME = $env:EXPECTED_TAG
          node scripts/verify-preview-artifacts.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Benchmark installation/runtime verification failed' }
        env:
          EXPECTED_TAG: ${{ steps.metadata.outputs.tag }}
      - name: Upload verified benchmark installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: installer-benchmark-${{ matrix.variant }}-${{ github.run_attempt }}
          path: |
            desktop/release/*-setup.exe
            desktop/release/*-setup.exe.blockmap
            desktop/release/beta.yml
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  quality:
    # Preserve branch-protection check names. This gate needs neither checkout
    # nor dependencies, and must fail even when an upstream job was skipped.
    name: Quality checks (${{ matrix.os }})
    needs: [tests, quality-validation, changelog]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Require complete tests and quality validation
        env:
          TEST_RESULT: ${{ needs.tests.result }}
          QUALITY_RESULT: ${{ needs.quality-validation.result }}
          CHANGELOG_RESULT: ${{ needs.changelog.result }}
        run: >-
          node -e "for (const name of ['TEST_RESULT', 'QUALITY_RESULT', 'CHANGELOG_RESULT']) {
          const result = process.env[name]; console.log(name + ': ' + result);
          if (result !== 'success') process.exitCode = 1; }"

  harmony-hardware:
    name: Harmony hardware acceptance (opt-in)
    if: github.event_name == 'workflow_dispatch' && inputs.run_hardware
    runs-on: [self-hosted, Windows, harmony-device]
    environment: harmony-hardware
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build:harmony-worker
      - name: Run explicit device scenarios
        shell: pwsh
        env:
          HARMONY_SERIAL: ${{ secrets.HARMONY_DEVICE_SERIAL }}
          HARMONY_PLAN: ${{ inputs.hardware_plan }}
          PIORA_HARMONY_TEST_CONTROL: '1'
        run: node scripts/verify-harmony-device.mjs --serial "$env:HARMONY_SERIAL" --plan "$env:HARMONY_PLAN"
      - name: Publish hardware summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path .verification/harmony-device-report.json) {
            Get-Content .verification/harmony-device-report.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }
