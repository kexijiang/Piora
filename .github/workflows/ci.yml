name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        if: runner.os == 'Linux'
        run: npm audit --omit=dev --audit-level=high

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          PIORA_SKIP_RESOURCE_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}

      - name: Resource-intensive Shell tests
        if: runner.os == 'Windows'
        run: npm run test:shell-resource

      - name: Check performance budgets
        if: runner.os == 'Linux'
        run: npm run perf:check

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

      - name: Build unpacked Windows application
        if: runner.os == 'Windows'
        run: npm run pack:win

      - name: Verify packaged standalone service in isolation
        if: runner.os == 'Windows'
        run: npm run verify:package
