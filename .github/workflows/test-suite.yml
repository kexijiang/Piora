name: Complete test suite

on:
  workflow_call:
    inputs:
      matrix:
        description: Exact platform/shard matrix (omitted on main to run the full suite)
        type: string
        default: '{"os":["windows-latest"],"shard":[1,2,3,4,5,6]}'

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, shard ${{ matrix.shard }}/6)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
          cache: ${{ startsWith(github.ref, 'refs/tags/') && '' || 'npm' }}

      - name: Restore npm downloads from an earlier lockfile
        if: steps.node-setup.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-npm-cache

      - name: Install Linux native image patch tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native-image-tools

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        if: runner.os == 'Linux'
        run: npx --no-install playwright-core install --with-deps chromium

      - name: Build Harmony worker
        run: npm run build:harmony-worker

      - name: Build desktop test fixtures
        run: npm run build:desktop

      - name: Compare Node and Electron native image loaders
        if: matrix.shard == 1
        run: node scripts/diagnose-sharp-electron.mjs

      # Call the launcher directly so npm cannot consume the Node test flags.
      # Each shard remains serial so native/browser fixtures do not compete.
      - name: Run test shard
        run: node scripts/run-tests.mjs --test-shard=${{ matrix.shard }}/6
        env:
          PIORA_SKIP_RESOURCE_TESTS: ${{ runner.os == 'Windows' && '1' || '0' }}
          PSModulePath: ""

      # These cases are skipped in the Windows shards and run exactly once here.
      - name: Resource-intensive Shell tests
        if: runner.os == 'Windows' && matrix.shard == 1
        run: npm run test:shell-resource
        env:
          PSModulePath: ""
