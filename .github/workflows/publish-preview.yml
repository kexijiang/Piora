name: Publish verified preview artifacts

on:
  workflow_run:
    workflows: [Preview Windows desktop packages]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag produced by harmony-preview.yml
        type: string
        required: true
      build_run_id:
        description: Successful preview build run to publish without rebuilding
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-preview-${{ inputs.tag || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish-preview:
    name: Publish verified preview
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       startsWith(github.event.workflow_run.head_branch, 'v') &&
       contains(github.event.workflow_run.head_branch, '-beta.'))
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      PREVIEW_TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      BUILD_RUN_ID: ${{ inputs.build_run_id || github.event.workflow_run.id }}

    steps:
      - name: Check out the verified tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.PREVIEW_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Bind the requested tag to one successful preview run
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PREVIEW_TAG -notmatch '^v\d+\.\d+\.\d+-beta\.\d+$') { throw 'tag must be a beta version tag' }
          if ($env:BUILD_RUN_ID -notmatch '^[1-9]\d*$') { throw 'build_run_id must be a GitHub Actions run id' }
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:PREVIEW_TAG --prerelease --require-origin-main
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata verification failed' }
          $tagCommit = (git rev-list -n 1 $env:PREVIEW_TAG).Trim()
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BUILD_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Unable to read the requested workflow run' }
          if ($run.event -ne 'push' -or $run.status -ne 'completed' -or $run.conclusion -ne 'success' `
              -or $run.path -ne '.github/workflows/harmony-preview.yml' -or $run.head_branch -ne $env:PREVIEW_TAG `
              -or $run.head_sha -ne $tagCommit) {
            throw 'The requested run is not the successful preview build for this exact tag commit'
          }

      - name: Download the exact verified preview payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ env.PREVIEW_TAG }}'
          path: downloaded-brands
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.BUILD_RUN_ID }}

      - name: Verify and assemble Piora artifacts
        shell: pwsh
        run: |
          node scripts/create-release-notes.mjs $env:PREVIEW_TAG accepted-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Canonical release-note generation failed' }
          New-Item -ItemType Directory -Path desktop -Force | Out-Null
          node "downloaded-brands/brand-release-tooling-$env:PREVIEW_TAG/assemble-brand-release.mjs" downloaded-brands desktop/release $env:PREVIEW_TAG accepted-release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Brand release assembly failed' }

      - name: Create GitHub prerelease from the verified bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:PREVIEW_TAG -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $assets = @(
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "Piora-$version-win-x64-setup.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "Piora-$version-win-x64-setup.exe.blockmap")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "beta.yml")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "SHA256SUMS.txt")).Path
          )
          $releaseNotesPath = (Resolve-Path -LiteralPath (Join-Path $releaseRoot 'release-notes.md')).Path
          gh release create $env:PREVIEW_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Piora $env:PREVIEW_TAG Preview" `
            --notes-file $releaseNotesPath `
            --verify-tag `
            --prerelease
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }
