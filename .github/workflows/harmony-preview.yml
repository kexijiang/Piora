name: Preview Windows desktop packages

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read
  actions: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  main-tests:
    name: Reuse matching main CI tests when available
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      reuse: ${{ steps.lookup.outputs.reuse }}
      matrix: ${{ steps.lookup.outputs.matrix }}
      plan: ${{ steps.lookup.outputs.plan }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Find successful test shards for the exact tagged commit
        id: lookup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reuse-main-ci-tests.mjs

  tests:
    needs: [main-tests]
    if: ${{ !cancelled() && needs.main-tests.outputs.reuse != 'true' }}
    uses: ./.github/workflows/test-suite.yml
    with:
      matrix: ${{ needs.main-tests.outputs.matrix }}

  test-gate:
    name: Require complete tests for the tagged commit
    needs: [main-tests, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify reused or fallback test results
        env:
          LOOKUP_RESULT: ${{ needs.main-tests.result }}
          TEST_PLAN: ${{ needs.main-tests.outputs.plan }}
          TEST_RESULT: ${{ needs.tests.result }}
        run: >-
          node --input-type=module -e "import { verifyTestPlan } from './scripts/reuse-main-ci-tests.mjs';
          if (!verifyTestPlan(JSON.parse(process.env.TEST_PLAN || 'null'), process.env.LOOKUP_RESULT,
          process.env.TEST_RESULT)) process.exitCode = 1;"

  preview-quality:
    name: Verify preview source in parallel
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PIORA_BRAND: piora
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0
      - name: Restore npm downloads from an earlier lockfile
        uses: ./.github/actions/restore-npm-cache
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm run audit:runtime
      - name: Verify Harmony schemas and documentation
        run: npm run harmony:docs:check
      - name: Verify release-tree hygiene
        run: npm run verify:hygiene
      - name: Verify license inventory freshness
        run: npm run licenses:check
      - name: Lint
        run: npm run lint
      - name: Generate Next.js route types
        run: npx --no-install next typegen
      - name: Typecheck with Next.js TypeScript version
        run: node node_modules/typescript/bin/tsc6 --noEmit
      - name: Typecheck
        run: npm run typecheck
      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds
      - name: Verify performance budgets
        run: npm run perf:check

  windows-preview:
    name: Build and verify preview (${{ matrix.brand }})
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: piora
            prefix: Piora
            channel: beta
    env:
      PIORA_BRAND: ${{ matrix.brand }}
      BRAND_PREFIX: ${{ matrix.prefix }}
      BRAND_CHANNEL: ${{ matrix.channel }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.19.0

      - name: Restore npm downloads from an earlier lockfile
        uses: ./.github/actions/restore-npm-cache

      - name: Verify preview tag and package metadata
        shell: pwsh
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:GITHUB_REF_NAME --prerelease --require-origin-main

      - name: Install dependencies
        run: npm ci

      - name: Prepare verified Electron download
        run: node scripts/prepare-electron-download.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build preview Windows installer
        run: npm run dist:win:preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIORA_PREVIEW_PARALLEL_TYPECHECK: "1"
          ELECTRON_BUILDER_COMPRESSION_LEVEL: "3"

      - name: Verify preview update metadata
        shell: pwsh
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release $env:GITHUB_REF_NAME

      - name: Install and smoke-test preview installer and verify artifacts in parallel
        run: node scripts/verify-preview-artifacts.mjs

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $expectedNames = @(
            "$env:BRAND_PREFIX-$version-win-x64-setup.exe",
            "$env:BRAND_PREFIX-$version-win-x64-setup.exe.blockmap",
            "$env:BRAND_CHANNEL.yml"
          )
          $artifacts = @($expectedNames | ForEach-Object {
            $path = Join-Path $releaseRoot $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected preview artifact is missing: $_"
            }
            Get-Item -LiteralPath $path
          })
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          Set-Content -LiteralPath desktop/release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate release notes
        shell: pwsh
        run: node scripts/create-release-notes.mjs $env:GITHUB_REF_NAME desktop/release/release-notes.md

      - name: Upload verified preview payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.brand }}-windows-${{ github.ref_name }}
          path: |
            desktop/release/*-setup.exe
            desktop/release/*-setup.exe.blockmap
            desktop/release/${{ matrix.channel }}.yml
            desktop/release/SHA256SUMS.txt
            desktop/release/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release assembly tooling
        if: matrix.brand == 'piora'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brand-release-tooling-${{ github.ref_name }}
          path: scripts/assemble-brand-release.mjs
          if-no-files-found: error
          retention-days: 14
