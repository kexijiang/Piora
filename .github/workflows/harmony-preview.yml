name: Preview Windows desktop packages

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: write

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preview:
    name: Build, verify, and publish preview
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify preview tag and package metadata
        shell: pwsh
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:GITHUB_REF_NAME --prerelease --require-origin-main

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

      - name: Verify performance budgets
        run: npm run perf:check

      - name: Build preview installer and portable application
        run: npm run dist:win:preview

      - name: Verify preview update metadata
        shell: pwsh
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release $env:GITHUB_REF_NAME

      - name: Verify packaged standalone service
        run: npm run verify:package

      - name: Verify packaged license bundle
        run: npm run licenses:package:check

      - name: Smoke-test packaged Electron runtime
        shell: pwsh
        run: node scripts/smoke-test-portable.mjs desktop/release/win-unpacked/Piora.exe --expected-version $env:GITHUB_REF_NAME --packaged-runtime

      - name: Install and smoke-test preview installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $installer = (Resolve-Path -LiteralPath "desktop/release/Piora-$version-win-x64-setup.exe").Path
          $installDirectory = Join-Path $env:RUNNER_TEMP "Piora-preview-$version"
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "Preview NSIS installation failed with exit code $($installation.ExitCode)"
          }
          $installedExecutable = Join-Path $installDirectory 'Piora.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "Installed preview executable is missing: $installedExecutable"
          }
          node scripts/smoke-test-portable.mjs $installedExecutable --expected-version $env:GITHUB_REF_NAME --packaged-runtime

      - name: Verify final portable wrapper
        shell: pwsh
        run: |
          node scripts/verify-portable-artifact.mjs --expected-version $env:GITHUB_REF_NAME
          $artifact = @(Get-ChildItem -LiteralPath desktop/release -Filter '*-portable.exe' -File)
          7z t $artifact[0].FullName

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $expectedNames = @(
            "Piora-$version-win-x64-portable.exe",
            "Piora-$version-win-x64-setup.exe",
            "Piora-$version-win-x64-setup.exe.blockmap",
            "beta.yml"
          )
          $artifacts = @($expectedNames | ForEach-Object {
            $path = Join-Path $releaseRoot $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected preview artifact is missing: $_"
            }
            Get-Item -LiteralPath $path
          })
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          Set-Content -LiteralPath desktop/release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate release notes
        shell: pwsh
        run: node scripts/create-release-notes.mjs $env:GITHUB_REF_NAME desktop/release/release-notes.md

      - name: Upload verified preview payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piora-windows-${{ github.ref_name }}
          path: |
            desktop/release/*-portable.exe
            desktop/release/*-setup.exe
            desktop/release/*-setup.exe.blockmap
            desktop/release/beta.yml
            desktop/release/SHA256SUMS.txt
            desktop/release/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Create GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $assets = @(
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "Piora-$version-win-x64-setup.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "Piora-$version-win-x64-setup.exe.blockmap")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "Piora-$version-win-x64-portable.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "beta.yml")).Path,
            (Resolve-Path -LiteralPath (Join-Path $releaseRoot "SHA256SUMS.txt")).Path
          )
          $releaseNotesPath = (Resolve-Path -LiteralPath (Join-Path $releaseRoot "release-notes.md")).Path
          gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Piora $env:GITHUB_REF_NAME Preview" `
            --notes-file $releaseNotesPath `
            --verify-tag `
            --prerelease
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
