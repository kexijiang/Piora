name: Preview Windows desktop packages

on:
  push:
    tags:
      - "v*-beta.*"

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/test-suite.yml
    with:
      platforms: '["ubuntu-latest", "windows-latest"]'

  harmony-mirror:
    name: Build, sign and accept Harmony mirror HAP
    runs-on: [self-hosted, Windows, harmony-device, harmony-api26, ephemeral]
    environment: harmony-hardware
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify preview tag and package metadata
        shell: pwsh
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:GITHUB_REF_NAME --prerelease --require-origin-main

      - name: Install dependencies
        run: npm ci

      - name: Build, sign and officially verify ordinary mirror HAP
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP "piora-harmony-mirror-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $resources = Join-Path $env:RUNNER_TEMP "piora-harmony-resource-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ((Test-Path -LiteralPath $workspace) -or (Test-Path -LiteralPath $resources)) {
            throw 'Ephemeral runner paths must be absent before the release build'
          }
          node scripts/build-harmony-mirror-release.mjs $workspace $resources

      - name: Install and accept the same signed HAP on the dedicated phone
        shell: pwsh
        env:
          HARMONY_SERIAL: ${{ secrets.HARMONY_DEVICE_SERIAL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HARMONY_SERIAL)) { throw 'HARMONY_DEVICE_SERIAL is required' }
          $resources = Join-Path $env:RUNNER_TEMP "piora-harmony-resource-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node scripts/verify-harmony-mirror-device.mjs $resources --serial $env:HARMONY_SERIAL

      - name: Stage accepted same-run mirror resource
        shell: pwsh
        run: |
          $resources = Join-Path $env:RUNNER_TEMP "piora-harmony-resource-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $staging = Join-Path $env:RUNNER_TEMP "piora-harmony-staging-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          node scripts/stage-harmony-mirror-artifact.mjs $resources $staging

      - name: Upload accepted Harmony mirror resource
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: harmony-mirror-resource-${{ github.ref_name }}
          path: |
            ${{ runner.temp }}/piora-harmony-staging-${{ github.run_id }}-${{ github.run_attempt }}/OHScrcpyServer.hap
            ${{ runner.temp }}/piora-harmony-staging-${{ github.run_id }}-${{ github.run_attempt }}/harmony-mirror-manifest.json
            ${{ runner.temp }}/piora-harmony-staging-${{ github.run_id }}-${{ github.run_attempt }}/harmony-mirror-signature-verification.json
            ${{ runner.temp }}/piora-harmony-staging-${{ github.run_id }}-${{ github.run_attempt }}/SOURCE.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  windows-preview:
    name: Build and verify preview (${{ matrix.brand }})
    needs: harmony-mirror
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: piora
            prefix: Piora
            channel: beta
    env:
      PIORA_BRAND: ${{ matrix.brand }}
      BRAND_PREFIX: ${{ matrix.prefix }}
      BRAND_CHANNEL: ${{ matrix.channel }}
      PIORA_REQUIRE_HARMONY_RELEASE_RESOURCE: '1'

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify preview tag and package metadata
        shell: pwsh
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:GITHUB_REF_NAME --prerelease --require-origin-main

      - name: Install dependencies
        run: npm ci

      - name: Download accepted Harmony mirror resource
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: harmony-mirror-resource-${{ github.ref_name }}
          path: .harmony-mirror-resource

      - name: Stage accepted Harmony mirror for desktop packaging
        run: node scripts/stage-harmony-mirror-artifact.mjs .harmony-mirror-resource third_party/harmony-tools/windows-x64

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify Harmony schemas and documentation
        run: npm run harmony:docs:check

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

      - name: Verify performance budgets
        run: npm run perf:check

      # A real ordinary-HAP build/sign/device chain must supply this same-run resource.
      # Do not synthesize acceptance for the checked-in 1.0.3 binary.
      - name: Verify accepted Harmony mirror release resource before packaging
        run: node scripts/verify-harmony-mirror-artifact.mjs

      - name: Build preview installer and portable application
        run: npm run dist:win:preview

      - name: Verify packaged Harmony mirror release resource
        run: node scripts/verify-harmony-mirror-artifact.mjs desktop/release/win-unpacked/resources/harmony-tools

      - name: Verify preview update metadata
        shell: pwsh
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release $env:GITHUB_REF_NAME

      - name: Verify packaged standalone service
        run: npm run verify:package

      - name: Verify packaged license bundle
        run: npm run licenses:package:check

      - name: Smoke-test packaged Electron runtime
        shell: pwsh
        run: node scripts/smoke-test-portable.mjs desktop/release/win-unpacked/Piora.exe --expected-version $env:GITHUB_REF_NAME --packaged-runtime --expected-brand $env:PIORA_BRAND

      - name: Install and smoke-test preview installer
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $installer = (Resolve-Path -LiteralPath "desktop/release/$env:BRAND_PREFIX-$version-win-x64-setup.exe").Path
          $installDirectory = Join-Path $env:RUNNER_TEMP "$env:BRAND_PREFIX-preview-$version"
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "Preview NSIS installation failed with exit code $($installation.ExitCode)"
          }
          $installedExecutable = Join-Path $installDirectory 'Piora.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "Installed preview executable is missing: $installedExecutable"
          }
          node scripts/smoke-test-portable.mjs $installedExecutable --expected-version $env:GITHUB_REF_NAME --packaged-runtime --expected-brand $env:PIORA_BRAND

      - name: Verify final portable wrapper
        shell: pwsh
        run: |
          node scripts/verify-portable-artifact.mjs --expected-version $env:GITHUB_REF_NAME
          $artifact = @(Get-ChildItem -LiteralPath desktop/release -Filter '*-portable.exe' -File)
          7z t $artifact[0].FullName

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $expectedNames = @(
            "$env:BRAND_PREFIX-$version-win-x64-portable.exe",
            "$env:BRAND_PREFIX-$version-win-x64-setup.exe",
            "$env:BRAND_PREFIX-$version-win-x64-setup.exe.blockmap",
            "$env:BRAND_CHANNEL.yml"
          )
          $artifacts = @($expectedNames | ForEach-Object {
            $path = Join-Path $releaseRoot $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected preview artifact is missing: $_"
            }
            Get-Item -LiteralPath $path
          })
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          Set-Content -LiteralPath desktop/release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Generate release notes
        shell: pwsh
        run: node scripts/create-release-notes.mjs $env:GITHUB_REF_NAME desktop/release/release-notes.md

      - name: Upload verified preview payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.brand }}-windows-${{ github.ref_name }}
          path: |
            desktop/release/*-portable.exe
            desktop/release/*-setup.exe
            desktop/release/*-setup.exe.blockmap
            desktop/release/${{ matrix.channel }}.yml
            desktop/release/SHA256SUMS.txt
            desktop/release/release-notes.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload release assembly tooling
        if: matrix.brand == 'piora'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brand-release-tooling-${{ github.ref_name }}
          path: scripts/assemble-brand-release.mjs
          if-no-files-found: error
          retention-days: 14
