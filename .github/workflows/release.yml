name: Release Windows desktop packages

on:
  push:
    tags:
      - "v*"

jobs:
  tests:
    if: ${{ !contains(github.ref_name, '-') }}
    uses: ./.github/workflows/test-suite.yml
    permissions:
      contents: read

  source-gate:
    name: Source gate (Ubuntu)
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Restore npm downloads from an earlier lockfile
        if: steps.node-setup.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-npm-cache

      - name: Verify release tag and metadata
        shell: bash
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs "$GITHUB_REF_NAME" --require-origin-main

      - name: Prepare version release notes
        run: node scripts/create-release-notes.mjs "$GITHUB_REF_NAME" release-notes.md

      - name: Upload version release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: piora-release-notes-${{ github.ref_name }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Install Linux native image patch tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native-image-tools

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:runtime

      - name: Upload release assembly tooling
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: brand-release-tooling-${{ github.ref_name }}
          path: scripts/assemble-brand-release.mjs
          if-no-files-found: error
          retention-days: 14

      - name: Verify Harmony schemas and documentation
        run: npm run harmony:docs:check

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

  windows-build:
    name: Build and verify windows (${{ matrix.brand }})
    needs: [source-gate]
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - brand: piora
            prefix: Piora
            channel: latest
    env:
      PIORA_BRAND: ${{ matrix.brand }}
      BRAND_PREFIX: ${{ matrix.prefix }}
      BRAND_CHANNEL: ${{ matrix.channel }}
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        id: node-setup
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Restore npm downloads from an earlier lockfile
        if: steps.node-setup.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-npm-cache

      - name: Verify release tag and metadata
        shell: pwsh
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:GITHUB_REF_NAME --require-origin-main

      - name: Install Linux native image patch tools
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-native-image-tools

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop applications
        run: npm run dist:win

      - name: Verify Windows update metadata
        shell: pwsh
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release "$env:GITHUB_REF_NAME"

      - name: Verify packaged standalone service
        run: npm run verify:package

      - name: Verify portable long-path extraction and integrity failures
        shell: pwsh
        run: |
          $env:PIORA_TEST_7ZA = (Resolve-Path -LiteralPath 'desktop/build/portable-extractor/7za.exe').Path
          node --test lib/portable-payload.test.mjs

      - name: Verify physical portable payload with packaged Electron
        shell: pwsh
        run: node scripts/verify-portable-runtime.mjs desktop/release/win-unpacked $env:GITHUB_REF_NAME

      - name: Smoke-test portable executable
        shell: pwsh
        # Hosted Windows runners apply aggressive scanning to self-extracting
        # unsigned executables and can stall the NSIS bootstrap indefinitely.
        # The same payload has already passed package isolation checks; exercise
        # the packaged Electron runtime directly here and keep the portable
        # wrapper's cached-launch gate for developer/release-machine validation.
        run: node scripts/smoke-test-portable.mjs desktop/release/win-unpacked/Piora.exe --expected-version "$env:GITHUB_REF_NAME" --packaged-runtime --expected-brand $env:PIORA_BRAND

      - name: Install and smoke-test NSIS application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $installer = (Resolve-Path -LiteralPath "desktop/release/$env:BRAND_PREFIX-$version-win-x64-setup.exe").Path
          $installDirectory = Join-Path $env:RUNNER_TEMP "$env:BRAND_PREFIX-installed-$version"
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -WindowStyle Hidden -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NSIS installation failed with exit code $($installation.ExitCode)"
          }
          $installedExecutable = Join-Path $installDirectory 'Piora.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "Installed Piora executable is missing: $installedExecutable"
          }
          node scripts/smoke-test-portable.mjs $installedExecutable --expected-version "$env:GITHUB_REF_NAME" --packaged-runtime --expected-brand $env:PIORA_BRAND

      - name: Create and verify extract-and-run archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $source = (Resolve-Path -LiteralPath desktop/release/win-unpacked).Path
          $archive = Join-Path (Resolve-Path -LiteralPath desktop/release).Path "$env:BRAND_PREFIX-$version-win-x64.zip"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal

          & 7z t $archive
          if ($LASTEXITCODE -ne 0) {
            throw "7z archive verification failed with exit code $LASTEXITCODE"
          }

          $verificationRoot = Join-Path (Resolve-Path -LiteralPath desktop/release).Path 'zip-verification'
          Expand-Archive -LiteralPath $archive -DestinationPath $verificationRoot
          foreach ($requiredPath in @(
            'Piora.exe',
            'resources/app.asar',
            'resources/web/server.js'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $verificationRoot $requiredPath) -PathType Leaf)) {
              throw "Extract-and-run archive is missing $requiredPath"
            }
          }
          Remove-Item -LiteralPath $verificationRoot -Recurse -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $expectedNames = @(
            "$env:BRAND_PREFIX-$version-win-x64-portable.exe",
            "$env:BRAND_PREFIX-$version-win-x64-setup.exe",
            "$env:BRAND_PREFIX-$version-win-x64-setup.exe.blockmap",
            "$env:BRAND_CHANNEL.yml",
            "$env:BRAND_PREFIX-$version-win-x64.zip"
          )
          $artifacts = @($expectedNames | ForEach-Object {
            $path = Join-Path $releaseRoot $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected release artifact is missing: $_"
            }
            Get-Item -LiteralPath $path
          })
          if ($artifacts.Count -ne $expectedNames.Count) {
            throw "Release artifact count does not match the expected package set."
          }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          Set-Content -LiteralPath desktop/release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload verified release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.brand }}-windows-${{ github.ref_name }}
          path: |
            desktop/release/*-portable.exe
            desktop/release/*-setup.exe
            desktop/release/*-setup.exe.blockmap
            desktop/release/*-win-x64.zip
            desktop/release/${{ matrix.channel }}.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish stable release
    needs: [tests, windows-build]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0

      - name: Download verified release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-${{ github.ref_name }}'
          path: downloaded-brands
          merge-multiple: false

      - name: Verify and assemble Piora artifacts
        shell: pwsh
        run: |
          $notes = "downloaded-brands/piora-release-notes-$env:GITHUB_REF_NAME/release-notes.md"
          node "downloaded-brands/brand-release-tooling-$env:GITHUB_REF_NAME/assemble-brand-release.mjs" downloaded-brands release-payload $env:GITHUB_REF_NAME $notes
          if ($LASTEXITCODE -ne 0) { throw 'Brand release assembly failed' }

      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = (Resolve-Path -LiteralPath release-payload).Path
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64-setup.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64-setup.exe.blockmap")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "latest.yml")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64-portable.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64.zip")).Path
          )
          $assets += (Resolve-Path -LiteralPath (Join-Path $root 'SHA256SUMS.txt')).Path
          # Stable desktop release notes were generated from the tagged CHANGELOG
          # in source-gate and arrive here through the artifact-only boundary.
          $releaseNotesPath = (Resolve-Path -LiteralPath (Join-Path $root 'release-notes.md')).Path
          & gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Piora $env:GITHUB_REF_NAME" `
            --notes-file $releaseNotesPath `
            --verify-tag `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
