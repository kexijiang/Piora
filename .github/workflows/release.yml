name: Release Windows and Linux desktop packages

on:
  push:
    tags:
      - "v*"

jobs:
  source-gate:
    name: Source gate (Ubuntu)
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify release tag and metadata
        shell: bash
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs "$GITHUB_REF_NAME" --require-origin-main

      - name: Prepare version release notes
        run: node scripts/create-release-notes.mjs "$GITHUB_REF_NAME" release-notes.md

      - name: Upload version release notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piora-release-notes-${{ github.ref_name }}
          path: release-notes.md
          if-no-files-found: error
          retention-days: 14

      - name: Install dependencies
        run: npm ci

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

  windows-build:
    name: Build and verify Windows portable packages
    needs: source-gate
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify release tag and metadata
        shell: pwsh
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs $env:GITHUB_REF_NAME --require-origin-main

      - name: Install dependencies
        run: npm ci

      - name: Verify release-tree hygiene
        run: npm run verify:hygiene

      - name: Verify license inventory freshness
        run: npm run licenses:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
        env:
          PIORA_SKIP_RESOURCE_TESTS: "1"
          PSModulePath: ""

      - name: Resource-intensive Shell tests
        run: npm run test:shell-resource
        env:
          PSModulePath: ""

      - name: Verify bundled backgrounds
        run: npm run verify:backgrounds

      - name: Build Windows desktop applications
        run: npm run dist:win

      - name: Verify Windows update metadata
        shell: pwsh
        run: node scripts/verify-windows-update-artifacts.mjs desktop/release "$env:GITHUB_REF_NAME"

      - name: Verify packaged standalone service
        run: npm run verify:package

      - name: Smoke-test portable executable
        shell: pwsh
        # Hosted Windows runners apply aggressive scanning to self-extracting
        # unsigned executables and can stall the NSIS bootstrap indefinitely.
        # The same payload has already passed package isolation checks; exercise
        # the packaged Electron runtime directly here and keep the portable
        # wrapper's cached-launch gate for developer/release-machine validation.
        run: node scripts/smoke-test-portable.mjs desktop/release/win-unpacked/Piora.exe --expected-version "$env:GITHUB_REF_NAME" --packaged-runtime

      - name: Install and smoke-test NSIS application
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $installer = (Resolve-Path -LiteralPath "desktop/release/Piora-$version-win-x64-setup.exe").Path
          $installDirectory = Join-Path $env:RUNNER_TEMP "Piora-installed-$version"
          $installation = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDirectory") -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "NSIS installation failed with exit code $($installation.ExitCode)"
          }
          $installedExecutable = Join-Path $installDirectory 'Piora.exe'
          if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
            throw "Installed Piora executable is missing: $installedExecutable"
          }
          node scripts/smoke-test-portable.mjs $installedExecutable --expected-version "$env:GITHUB_REF_NAME" --packaged-runtime

      - name: Create and verify extract-and-run archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $source = (Resolve-Path -LiteralPath desktop/release/win-unpacked).Path
          $archive = Join-Path (Resolve-Path -LiteralPath desktop/release).Path "Piora-$version-win-x64.zip"
          Compress-Archive -Path (Join-Path $source '*') -DestinationPath $archive -CompressionLevel Optimal

          & 7z t $archive
          if ($LASTEXITCODE -ne 0) {
            throw "7z archive verification failed with exit code $LASTEXITCODE"
          }

          $verificationRoot = Join-Path (Resolve-Path -LiteralPath desktop/release).Path 'zip-verification'
          Expand-Archive -LiteralPath $archive -DestinationPath $verificationRoot
          foreach ($requiredPath in @(
            'Piora.exe',
            'resources/app.asar',
            'resources/web/server.js'
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $verificationRoot $requiredPath) -PathType Leaf)) {
              throw "Extract-and-run archive is missing $requiredPath"
            }
          }
          Remove-Item -LiteralPath $verificationRoot -Recurse -Force

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $releaseRoot = (Resolve-Path -LiteralPath desktop/release).Path
          $expectedNames = @(
            "Piora-$version-win-x64-portable.exe",
            "Piora-$version-win-x64-setup.exe",
            "Piora-$version-win-x64-setup.exe.blockmap",
            "latest.yml",
            "Piora-$version-win-x64.zip"
          )
          $artifacts = @($expectedNames | ForEach-Object {
            $path = Join-Path $releaseRoot $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected release artifact is missing: $_"
            }
            Get-Item -LiteralPath $path
          })
          if ($artifacts.Count -ne $expectedNames.Count) {
            throw "Release artifact count does not match the expected package set."
          }
          $lines = foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            "$hash  $($artifact.Name)"
          }
          Set-Content -LiteralPath desktop/release/SHA256SUMS.txt -Value $lines -Encoding ascii

      - name: Upload verified release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piora-windows-${{ github.ref_name }}
          path: |
            desktop/release/*-portable.exe
            desktop/release/*-setup.exe
            desktop/release/*-setup.exe.blockmap
            desktop/release/*-win-x64.zip
            desktop/release/latest.yml
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  linux-build:
    name: Build and verify Linux AppImage
    needs: source-gate
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read

    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.19.0
          cache: npm

      - name: Verify release tag and metadata
        shell: bash
        run: |
          git fetch --no-tags --force origin +refs/heads/main:refs/remotes/origin/main
          node scripts/verify-release-metadata.mjs "$GITHUB_REF_NAME" --require-origin-main

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist:linux

      - name: Verify packaged standalone service
        run: node scripts/verify-packaged-web.mjs desktop/release/linux-unpacked/resources/web --require-electron-shell

      - name: Extract and smoke-test AppImage
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="desktop/release/Piora-$version-linux-x64-portable.AppImage"
          test -f "$artifact"
          chmod +x "$artifact"
          (cd desktop/release && "./$(basename "$artifact")" --appimage-extract >/dev/null)
          xvfb-run -a node scripts/smoke-test-portable.mjs desktop/release/squashfs-root/AppRun --expected-version "$GITHUB_REF_NAME" --packaged-runtime

      - name: Generate Linux checksum
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          artifact="desktop/release/Piora-$version-linux-x64-portable.AppImage"
          hash="$(sha256sum "$artifact" | cut -d' ' -f1)"
          printf '%s  %s\n' "$hash" "$(basename "$artifact")" > desktop/release/SHA256SUMS-linux.txt

      - name: Upload verified Linux payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: piora-linux-${{ github.ref_name }}
          path: |
            desktop/release/*-linux-x64-portable.AppImage
            desktop/release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish stable release
    needs: [windows-build, linux-build]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: piora-*-${{ github.ref_name }}
          path: release-payload
          merge-multiple: true

      - name: Verify downloaded SHA-256 checksums
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath release-payload).Path
          $checksumPath = Join-Path $root 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) {
            throw 'SHA256SUMS.txt is missing from the downloaded artifact.'
          }

          $expected = @{}
          foreach ($line in Get-Content -LiteralPath $checksumPath) {
            if ($line -notmatch '^([0-9a-fA-F]{64})  ([^\\/]+\.(?:exe|zip|blockmap|yml))$') {
              throw "Malformed checksum line: $line"
            }
            $name = $Matches[2]
            if ($expected.ContainsKey($name)) {
              throw "Duplicate checksum entry: $name"
            }
            $expected[$name] = $Matches[1].ToLowerInvariant()
          }

          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $expectedNames = @(
            "Piora-$version-win-x64-portable.exe",
            "Piora-$version-win-x64-setup.exe",
            "Piora-$version-win-x64-setup.exe.blockmap",
            "latest.yml",
            "Piora-$version-win-x64.zip"
          )
          $artifacts = @(Get-ChildItem -LiteralPath $root -File | Where-Object {
            $_.Name -in $expectedNames
          })
          if ($artifacts.Count -ne $expectedNames.Count -or $artifacts.Count -ne $expected.Count) {
            throw 'Release artifact count does not match SHA256SUMS.txt.'
          }
          foreach ($artifact in $artifacts) {
            if (-not $expected.ContainsKey($artifact.Name)) {
              throw "Release artifact is not listed in SHA256SUMS.txt: $($artifact.Name)"
            }
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact.FullName).Hash.ToLowerInvariant()
            if ($actual -ne $expected[$artifact.Name]) {
              throw "SHA-256 mismatch for $($artifact.Name)"
            }
          }

      - name: Verify Linux checksum and combine manifest
        shell: pwsh
        run: |
          $root = (Resolve-Path -LiteralPath release-payload).Path
          $linuxChecksumPath = Join-Path $root 'SHA256SUMS-linux.txt'
          $combinedChecksumPath = Join-Path $root 'SHA256SUMS.txt'
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $expectedName = "Piora-$version-linux-x64-portable.AppImage"
          $line = @(Get-Content -LiteralPath $linuxChecksumPath)
          if ($line.Count -ne 1 -or $line[0] -notmatch '^([0-9a-fA-F]{64})  ([^\\/]+\.AppImage)$') {
            throw 'Linux checksum manifest is malformed.'
          }
          if ($Matches[2] -ne $expectedName) {
            throw "Unexpected Linux artifact in checksum manifest: $($Matches[2])"
          }
          $artifact = Join-Path $root $expectedName
          if (-not (Test-Path -LiteralPath $artifact -PathType Leaf)) {
            throw "Expected Linux release artifact is missing: $expectedName"
          }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $artifact).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1].ToLowerInvariant()) {
            throw "SHA-256 mismatch for $expectedName"
          }
          Add-Content -LiteralPath $combinedChecksumPath -Value $line[0] -Encoding ascii
          Remove-Item -LiteralPath $linuxChecksumPath -Force

      - name: Publish stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $root = (Resolve-Path -LiteralPath release-payload).Path
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $assets = @(
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64-setup.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64-setup.exe.blockmap")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "latest.yml")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64-portable.exe")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-win-x64.zip")).Path,
            (Resolve-Path -LiteralPath (Join-Path $root "Piora-$version-linux-x64-portable.AppImage")).Path
          )
          $assets += (Resolve-Path -LiteralPath (Join-Path $root 'SHA256SUMS.txt')).Path
          # Stable desktop release notes were generated from the tagged CHANGELOG
          # in source-gate and arrive here through the artifact-only boundary.
          $releaseNotesPath = (Resolve-Path -LiteralPath (Join-Path $root 'release-notes.md')).Path
          & gh release create $env:GITHUB_REF_NAME @assets `
            --repo $env:GITHUB_REPOSITORY `
            --title "Piora $env:GITHUB_REF_NAME" `
            --notes-file $releaseNotesPath `
            --verify-tag `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed with exit code $LASTEXITCODE"
          }
