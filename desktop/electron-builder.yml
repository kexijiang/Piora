appId: io.github.kexijiang.piora
productName: Piora
copyright: Copyright © 2026 Piora contributors
asar: true
asarUnpack:
  - node_modules/koffi/**/*
  - node_modules/@koromix/koffi-*/**/*
# Compress the Windows installer payload with normal zlib compression.
compression: normal
afterPack: ../scripts/electron-after-pack-licenses.cjs
beforeBuild: ../scripts/electron-before-build.cjs
artifactBuildStarted: ../scripts/electron-portable-payload.cjs
afterAllArtifactBuild: ../scripts/electron-portable-payload.cjs
releaseInfo:
  releaseNotesFile: release-notes.md

directories:
  buildResources: build
  output: release

files:
  - dist/**/*
  - package.json

# `npm run build:web` stages public/ and .next/static/ into this tree.
extraResources:
  - from: build/startup
    to: startup
    filter:
      - "*.mp4"
      - "*.jpg"
  # Keep a real ICO beside the packaged app. Reading an icon back from the
  # portable wrapper executable is not reliable across Windows versions.
  - from: build/icon.ico
    to: tray-icon.ico
  - from: build/icon.png
    to: tray-icon.png
  - from: ../.next/standalone
    to: web
    filter:
      - "**/*"
      - "!node_modules{,/**/*}"
  # electron-builder excludes nested node_modules from broad resource copies.
  # Copy the standalone dependency tree from its own root so a packaged app
  # cannot accidentally resolve dependencies from a developer checkout.
  - from: ../.next/standalone/node_modules
    to: web/node_modules
    filter:
      - "**/*"
  # Next's standalone trace can omit @swc/helpers even though the bundled
  # server imports it at runtime. Copy it explicitly so directory builds do
  # not depend on a developer checkout.
  - from: ../node_modules/@swc/helpers
    to: web/node_modules/@swc/helpers
    filter:
      - "**/*"
  # Next standalone tracing keeps the Pi package JavaScript but can omit
  # runtime assets loaded by the agent (for example interactive theme JSON).
  # Copy the published dist tree explicitly so session creation works in the
  # packaged app, not only when a developer checkout is nearby.
  - from: ../node_modules/@earendil-works/pi-coding-agent/dist
    to: web/node_modules/@earendil-works/pi-coding-agent/dist
    filter:
      - "**/*"
  - from: ../LICENSE
    to: licenses/LICENSE
  - from: ../NOTICE
    to: licenses/NOTICE
  - from: ../THIRD_PARTY_LICENSES.md
    to: licenses/THIRD_PARTY_LICENSES.md
  - from: ../third_party/harmony-video
    to: web/third_party/harmony-video
    filter:
      - "*.so"
      - "manifest.json"
      - "LICENSE"
      - "SOURCE.md"
  - from: ../third_party/harmony-video
    to: licenses/harmony-video
    filter:
      - "LICENSE"
      - "SOURCE.md"
      - "manifest.json"
  - from: ../third_party/openai-codex
    to: licenses/openai-codex
    filter:
      - "LICENSE"
      - "NOTICE"
      - "SOURCE.md"
  - from: ../third_party/openpets
    to: licenses/openpets
    filter:
      - "LICENSE"
      - "SOURCE.md"
  - from: ../third_party/mediabunny
    to: licenses/mediabunny
    filter:
      - "LICENSE"
      - "SOURCE.md"
  - from: ../third_party/sensevoice
    to: licenses/sensevoice
    filter:
      - "LICENSE"
      - "MODEL_LICENSE"
      - "SHERPA-LICENSE"
      - "ONNXRUNTIME-LICENSE"
      - "ONNXRUNTIME-NOTICES"
      - "SOURCE.md"
  - from: ../node_modules/mediabunny/src
    to: licenses/mediabunny/source
    filter:
      - "**/*"
  # The packaged web verifier and runtime signing bridge share this source on
  # every desktop platform. Windows additionally supplies HDC and the HAP.
  - from: ../lib/harmony/runtime/PioraHapSigner.java
    to: harmony-tools/PioraHapSigner.java
  # Runtime signing uses this metadata-only project copy when the user has no
  # hand-authored descriptor. DevEco CLI writes credentials only to the
  # private user/cache directories created at initialization time.
  - from: ../third_party/harmony-mirror
    to: harmony-tools/signing-project
    filter:
      - "build-profile.json5"
      - "oh-package.json5"
      - "hvigorfile.ts"
      - "hvigor/hvigor-config.json5"
      - "AppScope/app.json5"
      - "entry/build-profile.json5"
      - "entry/oh-package.json5"
      - "entry/hvigorfile.ts"
      - "entry/src/main/module.json5"

win:
  icon: icon.ico
  extraResources:
    - from: build/portable-extractor
      to: portable-extractor
      filter:
        - "**/*"
    - from: ../node_modules/@microsoft/winappcli/bin/win-x64
      to: winappcli
      filter:
        - "**/*"
    - from: ../node_modules/@microsoft/winappcli/LICENSE
      to: licenses/winappcli-LICENSE
    - from: build/powershell
      to: powershell
      filter:
        - "**/*"
    - from: ../third_party/harmony-tools/windows-x64
      to: harmony-tools
      filter:
        - "hdc.exe"
        - "libusb_shared.dll"
        - "OHScrcpyServer.hap"
        - "harmony-mirror-manifest.json"
        - "harmony-mirror-signature-verification.json"
        - "LICENSE*"
        - "SOURCE.md"
  # Stable releases are currently checksum-verified but not Authenticode
  # signed. Keep updater signature verification disabled until CI is supplied
  # with a Windows signing certificate, otherwise unsigned update installers
  # are rejected before their manifest SHA-512 can be checked.
  verifyUpdateCodeSignature: false
  # Piora renders its own localized interface. Keep only the Chromium locale
  # packs used by the shipped English and Simplified-Chinese defaults instead
  # of extracting every Electron locale on every portable launch.
  electronLanguages:
    - en-US
    - zh-CN
  target:
    - target: nsis
      arch:
        - x64

# The build machine may not reach github.com (the electron download source).
# The Electron zip is already cached locally; skip the online SHASUMS256.txt
# verification so packaging works offline.
electronDownload:
  isVerifyChecksum: false

publish:
  provider: github
  owner: kexijiang
  repo: Piora
  releaseType: release

nsis:
  # Include every payload file in the archive for exact integrity verification.
  preCompressedFileExtensions: []
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Piora
  uninstallDisplayName: Piora
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: ${productName}-${version}-win-x64-setup.${ext}
